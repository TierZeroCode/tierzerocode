services:
  db:
    image: postgres:17-bookworm
    environment:
      - POSTGRES_DB=${TZC_DATABASE_NAME:-dockerdjango}
      - POSTGRES_USER=${TZC_DATABASE_USER:?TZC_DATABASE_USER is required}
      - POSTGRES_PASSWORD=${TZC_DATABASE_PASSWORD:?TZC_DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TZC_DATABASE_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: docker.io/andrewixl/tierzerocode:latest
    ports:
      - "${TZC_WEB_PORT:-8000}:8000"
    environment:
      # Django settings
      - SECRET_KEY=${TZC_SECRET_KEY:?TZC_SECRET_KEY is required}
      - DEBUG=${TZC_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${TZC_DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - USE_HTTPS=${TZC_USE_HTTPS:-True}
      # Database settings
      - DATABASE_HOST=db
      - DATABASE_NAME=${TZC_DATABASE_NAME:-dockerdjango}
      - DATABASE_USER=${TZC_DATABASE_USER:?TZC_DATABASE_USER is required}
      - DATABASE_PASSWORD=${TZC_DATABASE_PASSWORD:?TZC_DATABASE_PASSWORD is required}
      - DATABASE_PORT=${TZC_DATABASE_PORT:-5432}
      - DATABASE_ENGINE=${TZC_DATABASE_ENGINE:-postgresql_psycopg2}
      # Redis settings
      - REDIS_HOST=redis
      - REDIS_PORT=${TZC_REDIS_PORT:-6379}
      - REDIS_DB=${TZC_REDIS_DB:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python -m gunicorn --bind 0.0.0.0:8000 --workers ${TZC_GUNICORN_WORKERS:-3} --timeout 300 tierzerocode.wsgi:application"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/identity/login\")'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: docker.io/andrewixl/tierzerocode:latest
    environment:
      # Django settings
      - SECRET_KEY=${TZC_SECRET_KEY:?TZC_SECRET_KEY is required}
      - DEBUG=${TZC_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${TZC_DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - USE_HTTPS=${TZC_USE_HTTPS:-True}
      # Database settings
      - DATABASE_HOST=db
      - DATABASE_NAME=${TZC_DATABASE_NAME:-dockerdjango}
      - DATABASE_USER=${TZC_DATABASE_USER:?TZC_DATABASE_USER is required}
      - DATABASE_PASSWORD=${TZC_DATABASE_PASSWORD:?TZC_DATABASE_PASSWORD is required}
      - DATABASE_PORT=${TZC_DATABASE_PORT:-5432}
      - DATABASE_ENGINE=${TZC_DATABASE_ENGINE:-postgresql_psycopg2}
      # Redis settings
      - REDIS_HOST=redis
      - REDIS_PORT=${TZC_REDIS_PORT:-6379}
      - REDIS_DB=${TZC_REDIS_DB:-0}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    command: python manage.py rqworker default --job-class django_tasks_rq.Job --with-scheduler

volumes:
  postgres_data:
  redis_data:
