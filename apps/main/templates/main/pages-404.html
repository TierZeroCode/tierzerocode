{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | C.O.D.E</title>
    <link rel="shortcut icon" href="{% static 'main/img/icons/icon-48x48.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'main/css/tailwind-output.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative">
    <!-- Gradient background -->
    <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900"></div>

    <div class="relative w-full max-w-lg text-center">
        <!-- Logo -->
        <div class="mb-8">
            <img src="{% static 'login_app/img/TierZeroCODE.png' %}" alt="Tier Zero C.O.D.E" class="h-10 mx-auto" onerror="this.style.display='none'">
        </div>

        <!-- Error content -->
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-12">
            <p class="text-8xl font-bold text-blue-600 dark:text-blue-400 mb-4">404</p>
            <h1 class="text-2xl font-semibold text-slate-900 dark:text-white mb-3">Page Not Found</h1>
            <p class="text-slate-500 dark:text-slate-400 mb-8">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <a href="/"
                class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors duration-150">
                Go to Dashboard
            </a>
        </div>

        <!-- Footer -->
        <p class="text-slate-500 text-xs mt-8">
            &copy; {% now "Y" %} Tier Zero Code LLC
        </p>
    </div>
</body>
</html>
